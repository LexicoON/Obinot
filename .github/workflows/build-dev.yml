name: Build dev

# Run this workflow when a commit is pushed to the dev branch
on:
  push:
    branches:
      - 'dev'
  pull_request:
    branches:
      - 'dev'

# Allow only one concurrent release build to avoid colliding on tag/state
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Create debug keystore
        # Used as a fallback if no upload keystore secrets are configured.
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -keystore debug.keystore \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode --ignore-garbage > my-upload-key.jks
            echo "Release keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret found — falling back to debug keystore (APK will still build but will be debug-signed)."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Built APK: $APK"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: ${{ steps.locate.outputs.apk_path }}