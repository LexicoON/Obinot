name: Build & Release APK

# Run this workflow when you push a tag like v1.1.2
on:
  push:
    tags:
      - 'v*.*.*'

# Allow only one concurrent release build to avoid colliding on tag/state
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Inspect RaTeX AAR packages
        # Diagnóstico: si el import de RaTeXView falla, este paso revela
        # el paquete real de las clases dentro del AAR descargado por Gradle.
        # Una vez confirmado el paquete, este paso se puede eliminar.
        run: |
          echo "=== Buscando AAR de ratex-android ==="
          find ~/.gradle/caches -name "ratex-android-*.aar" 2>/dev/null | head -5
          echo "=== Contenido de clases (primeras 30) ==="
          find ~/.gradle/caches -name "ratex-android-*.aar" 2>/dev/null | head -1 | xargs -I{} unzip -l {} | grep -E "\.class$" | head -30 || true

      - name: Create debug keystore
        # Used as a fallback if no upload keystore secrets are configured.
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -keystore debug.keystore \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode --ignore-garbage > my-upload-key.jks
            echo "Release keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret found — falling back to debug keystore (APK will still build but will be debug-signed)."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Locate and rename APK
        id: locate
        run: |
          TAG="${GITHUB_REF_NAME}"
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          DEST="app/build/outputs/apk/release/Obinot-${TAG}.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Built APK: $DEST"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Obinot-${{ steps.locate.outputs.tag }}
          path: ${{ steps.locate.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # name/body intentionally omitted: if you already created the release
          # in the GitHub UI with your own title + changelog, this step will
          # leave both untouched and just attach the APK below.
          draft: false
          prerelease: false
          files: |
            ${{ steps.locate.outputs.apk_path }}